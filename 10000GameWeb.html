<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>10,000 Dice Game</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e293b;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .box {
      background: #0f172a;
      padding: 20px;
      border-radius: 10px;
      width: 350px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: relative;
      transition: transform 0.05s;
    }
    h1 { color: #f59e0b; margin-top: 0; }
    input {
      width: 80%;
      padding: 8px;
      margin: 5px 0 15px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background: #f59e0b;
      color: white;
      border: none;
      padding: 10px 15px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .mode-select {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .mode-btn {
      background: #334155;
      padding: 8px 12px;
      font-size: 13px;
    }
    .mode-btn.active {
      background: #3b82f6;
    }
    .banner {
      padding: 8px;
      font-weight: bold;
      background: #3b82f6;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    .board {
      display: flex;
      justify-content: space-around;
      background: rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
    }
    .dice-area {
      display: flex;
      justify-content: center;
      gap: 8px;
      min-height: 50px;
      margin-bottom: 15px;
    }
    .die {
      width: 40px;
      height: 40px;
      background: white;
      color: black;
      font-weight: bold;
      font-size: 20px;
      line-height: 40px;
      border-radius: 5px;
      cursor: pointer;
      border: 3px solid transparent;
      transition: transform 0.1s;
    }
    .die.selected { border-color: #10b981; transform: translateY(-3px); }
    .die.banked { opacity: 0.3; cursor: default; }
    .die.unrolled { background: #475569; color: #94a3b8; }
    .msg { color: #f59e0b; font-weight: bold; min-height: 20px; margin-top: 10px; }

    .link-box {
      display: none;
      background: rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
    }

    /* FLASHY MELTDOWN EFFECT STYLES */
    @keyframes meltdowns-shake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-8px, 5px) rotate(-3deg); }
      40% { transform: translate(8px, -5px) rotate(3deg); }
      60% { transform: translate(-8px, -5px) rotate(-2deg); }
      80% { transform: translate(8px, 5px) rotate(2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes strobe-bg {
      0%, 100% { background-color: #1e293b; }
      25% { background-color: #7f1d1d; }
      50% { background-color: #dc2626; }
      75% { background-color: #450a0a; }
    }

    body.meltdown { animation: strobe-bg 0.15s infinite; }
    .box.meltdown-shake {
      animation: meltdowns-shake 0.1s infinite;
      border: 3px solid #ef4444;
      box-shadow: 0 0 35px #ef4444;
    }

    .meltdown-banner {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: 42px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 20px #ef4444, 0 0 40px #ef4444;
      z-index: 100;
      pointer-events: none;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      white-space: nowrap;
    }

    .meltdown-banner.show { display: block; transform: translate(-50%, -50%) scale(1.1); }

    /* WINNER HEART ANIMATION */
    #heart-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 200; display: none;
      justify-content: center; align-items: center;
    }
    .main-heart {
      font-size: 150px;
      animation: heart-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                 heart-explode 0.4s ease-out 0.6s forwards;
    }
    @keyframes heart-pop { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.3); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes heart-explode { 0% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 0px red); } 50% { transform: scale(2.5); opacity: 0.8; filter: drop-shadow(0 0 50px red); } 100% { transform: scale(4); opacity: 0; filter: drop-shadow(0 0 100px red); } }
    .particle-heart { position: absolute; font-size: 24px; animation: heart-particle 1.2s ease-out forwards; }
    @keyframes heart-particle { 0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0.2) rotate(var(--rot)); opacity: 0; } }
  </style>
</head>
<body>

<div id="heart-overlay"><div class="main-heart">❤️</div></div>
<div id="meltdown-text" class="meltdown-banner">💥 BUST! 💥</div>

<div class="box" id="game-box">
  <h1>10,000 Dice</h1>

  <div id="setup">
    <div class="mode-select">
      <button class="mode-btn active" id="btn-local" onclick="setMode('local')">Local Play</button>
      <button class="mode-btn" id="btn-online" onclick="setMode('online')">Online Link</button>
    </div>

    <p>Your Name:</p>
    <input type="text" id="p1" value="Player 1">
    
    <div id="p2-input-group">
      <p>Player 2 Name:</p>
      <input type="text" id="p2" value="Player 2">
    </div>

    <button id="btn-start" onclick="startSetup()">Start Game</button>

    <div id="link-box" class="link-box">
      <p style="font-size: 12px; margin: 0 0 5px 0;">Share this link with Player 2:</p>
      <button onclick="copyGameLink()">📋 Copy Invite Link</button>
      <p id="link-status" style="font-size: 11px; color: #f59e0b; margin: 5px 0 0 0;">Connecting to WebRTC...</p>
    </div>
  </div>

  <div id="game" style="display:none;">
    <div id="turn-banner" class="banner">Player 1's Turn</div>

    <div class="board">
      <div><small id="l1">P1</small><br><b id="s1">0</b></div>
      <div><small>Turn</small><br><b id="st">0</b></div>
      <div><small id="l2">P2</small><br><b id="s2">0</b></div>
    </div>

    <div class="dice-area" id="dice-box"></div>

    <div>
      <button id="btn-roll" onclick="handleRoll()">Roll</button>
      <button id="btn-bank" onclick="handleBank()" disabled>Bank</button>
    </div>

    <div id="msg" class="msg"></div>
  </div>
</div>

<script>
  var p1Name = "Player 1", p2Name = "Player 2";
  var activeP = 1, myPlayerNum = 1;
  var scores = {1: 0, 2: 0};
  var turnScore = 0;
  var hasRolled = false, isLocked = false, isOnline = false;
  var gameMode = "local";
  
  var peer = null, conn = null;
  var dice = [
    {val: '?', sel: false, bnk: false},
    {val: '?', sel: false, bnk: false},
    {val: '?', sel: false, bnk: false},
    {val: '?', sel: false, bnk: false},
    {val: '?', sel: false, bnk: false},
    {val: '?', sel: false, bnk: false}
  ];

  // Auto detect if opened from invite link
  window.onload = function() {
    var urlParams = new URLSearchParams(window.location.search);
    var roomId = urlParams.get('game');
    if (roomId) {
      setMode('online');
      document.getElementById('setup').innerHTML = '<h3>Joining Online Game...</h3><p id="join-status">Connecting to Host...</p>';
      joinOnlineGame(roomId);
    }
  };

  function setMode(m) {
    gameMode = m;
    document.getElementById('btn-local').className = 'mode-btn' + (m === 'local' ? ' active' : '');
    document.getElementById('btn-online').className = 'mode-btn' + (m === 'online' ? ' active' : '');
    document.getElementById('p2-input-group').style.display = (m === 'local' ? 'block' : 'none');
  }

  function startSetup() {
    p1Name = document.getElementById('p1').value || "Player 1";
    if (gameMode === 'local') {
      p2Name = document.getElementById('p2').value || "Player 2";
      launchGame();
    } else {
      isOnline = true;
      document.getElementById('btn-start').disabled = true;
      document.getElementById('link-box').style.display = 'block';
      hostOnlineGame();
    }
  }

  function hostOnlineGame() {
    peer = new Peer();
    peer.on('open', function(id) {
      var gameUrl = window.location.origin + window.location.pathname + '?game=' + id;
      window.currentInviteUrl = gameUrl;
      document.getElementById('link-status').innerText = "Waiting for Player 2 to join...";
    });

    peer.on('connection', function(c) {
      conn = c;
      myPlayerNum = 1;
      setupNetworking();
    });
  }

  function joinOnlineGame(roomId) {
    isOnline = true;
    myPlayerNum = 2;
    peer = new Peer();
    peer.on('open', function() {
      conn = peer.connect(roomId);
      setupNetworking();
    });
  }

  function copyGameLink() {
    if (window.currentInviteUrl) {
      navigator.clipboard.writeText(window.currentInviteUrl);
      document.getElementById('link-status').innerText = "Link copied to clipboard!";
    }
  }

  function setupNetworking() {
    conn.on('open', function() {
      // Exchange names
      conn.send({ type: 'JOIN', name: p1Name });
    });

    conn.on('data', function(data) {
      if (data.type === 'JOIN') {
        if (myPlayerNum === 1) {
          p2Name = data.name;
          conn.send({ type: 'WELCOME', name: p1Name });
          launchGame();
        } else {
          p2Name = p1Name; // My name as P2
          p1Name = data.name; // Host name as P1
          launchGame();
        }
      } else if (data.type === 'STATE_SYNC') {
        syncGameState(data.state);
      }
    });
  }

  function sendState() {
    if (isOnline && conn) {
      conn.send({
        type: 'STATE_SYNC',
        state: {
          dice: dice,
          turnScore: turnScore,
          scores: scores,
          activeP: activeP,
          hasRolled: hasRolled,
          isLocked: isLocked
        }
      });
    }
  }

  function syncGameState(state) {
    dice = state.dice;
    turnScore = state.turnScore;
    scores = state.scores;
    activeP = state.activeP;
    hasRolled = state.hasRolled;
    isLocked = state.isLocked;
    
    var name = activeP === 1 ? p1Name : p2Name;
    document.getElementById('turn-banner').innerText = name + "'s Turn";
    document.getElementById('turn-banner').style.background = activeP === 1 ? '#3b82f6' : '#ec4899';
    draw();
  }

  function launchGame() {
    document.getElementById('l1').innerText = p1Name;
    document.getElementById('l2').innerText = p2Name;
    document.getElementById('setup').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    resetTurn();
  }

  function handleRoll() {
    if (isOnline && activeP !== myPlayerNum) return;
    roll();
    sendState();
  }

  function handleBank() {
    if (isOnline && activeP !== myPlayerNum) return;
    bank();
    sendState();
  }

  function handleToggle(i) {
    if (isOnline && activeP !== myPlayerNum) return;
    toggle(i);
    sendState();
  }

  function getScore(vals) {
    if (!vals.length) return {pts: 0, ok: true};
    var pts = 0, used = 0, c = {};
    vals.forEach(function(v){ c[v] = (c[v]||0)+1; });

    if (Object.keys(c).length === 6) return {pts: 1500, ok: true};
    var pairs = 0;
    for (var k in c) { if (c[k] === 2) pairs++; }
    if (pairs === 3) return {pts: 1500, ok: true};

    for (var k in c) {
      var n = Number(k), cnt = c[k];
      if (cnt >= 3) {
        pts += (n === 1 ? 1000 : n * 100) * Math.pow(2, cnt - 3);
        used += cnt;
        delete c[k];
      }
    }
    if (c[1]) { pts += c[1] * 100; used += c[1]; }
    if (c[5]) { pts += c[5] * 50; used += c[5]; }

    return {pts: pts, ok: used === vals.length};
  }

  function roll() {
    if (isLocked) return;

    if (hasRolled) {
      var selVals = [];
      dice.forEach(function(d){ if(d.sel) selVals.push(d.val); });
      var sc = getScore(selVals);
      if (!sc.ok || !selVals.length) {
        setMsg("Select valid scoring dice first!");
        return;
      }
      turnScore += sc.pts;
      dice.forEach(function(d){ if(d.sel) { d.bnk = true; d.sel = false; } });
      
      if (dice.every(function(d){ return d.bnk; })) {
        dice.forEach(function(d){ d.bnk = false; });
        setMsg("Hot Dice! Roll all 6 again!");
      }
    }

    dice.forEach(function(d){
      if (!d.bnk) d.val = Math.floor(Math.random() * 6) + 1;
    });
    hasRolled = true;

    var activeVals = [];
    dice.forEach(function(d){ if(!d.bnk) activeVals.push(d.val); });
    
    var c = {};
    activeVals.forEach(function(v){ c[v] = (c[v]||0)+1; });
    var canScore = c[1] || c[5] || Object.keys(c).some(function(k){ return c[k]>=3; }) || activeVals.length === 6;

    draw();

    if (!canScore) {
      triggerMeltdown("💥 BUST! 💥", "NO SCORING DICE! TURN LOST!");
      return;
    }

    setMsg("Select dice to bank or roll again.");
  }

  function triggerMeltdown(bannerText, msgText) {
    isLocked = true;
    turnScore = 0;
    draw();

    var banner = document.getElementById('meltdown-text');
    banner.innerText = bannerText;

    document.body.classList.add('meltdown');
    document.getElementById('game-box').classList.add('meltdown-shake');
    banner.classList.add('show');
    document.getElementById('btn-roll').disabled = true;
    document.getElementById('btn-bank').disabled = true;
    setMsg(msgText);

    setTimeout(function() {
      document.body.classList.remove('meltdown');
      document.getElementById('game-box').classList.remove('meltdown-shake');
      banner.classList.remove('show');
      isLocked = false;
      activeP = activeP === 1 ? 2 : 1;
      resetTurn();
      sendState();
    }, 2200);
  }

  function triggerHeartExplosion() {
    var overlay = document.getElementById('heart-overlay');
    overlay.style.display = 'flex';

    setTimeout(function() {
      for (var i = 0; i < 40; i++) {
        var particle = document.createElement('div');
        particle.className = 'particle-heart';
        particle.innerText = '❤️';

        var angle = Math.random() * Math.PI * 2;
        var dist = 150 + Math.random() * 350;
        var tx = Math.cos(angle) * dist + 'px';
        var ty = Math.sin(angle) * dist + 'px';
        var rot = (Math.random() * 360 - 180) + 'deg';

        particle.style.setProperty('--tx', tx);
        particle.style.setProperty('--ty', ty);
        particle.style.setProperty('--rot', rot);

        overlay.appendChild(particle);
      }
    }, 600);
  }

  function toggle(i) {
    if (!hasRolled || dice[i].bnk || isLocked) return;
    dice[i].sel = !dice[i].sel;
    draw();
  }

  function bank() {
    if (isLocked) return;

    var selVals = [];
    dice.forEach(function(d){ if(d.sel) selVals.push(d.val); });
    var sc = getScore(selVals);
    if (!sc.ok || !selVals.length) return;

    var potentialTotal = scores[activeP] + turnScore + sc.pts;

    if (potentialTotal > 10000) {
      triggerMeltdown("💥 OVER 10,000! 💥", "EXCEEDED 10,000! POINTS BUST!");
      return;
    }

    scores[activeP] = potentialTotal;
    if (scores[activeP] === 10000) {
      draw();
      setMsg((activeP === 1 ? p1Name : p2Name) + " WINS EXACTLY AT 10,000!");
      document.getElementById('turn-banner').innerText = (activeP === 1 ? p1Name : p2Name) + " WINS!";
      document.getElementById('btn-roll').disabled = true;
      document.getElementById('btn-bank').disabled = true;
      triggerHeartExplosion();
      return;
    }

    activeP = activeP === 1 ? 2 : 1;
    resetTurn();
  }

  function resetTurn() {
    hasRolled = false;
    turnScore = 0;
    dice.forEach(function(d){ d.val = '?'; d.sel = false; d.bnk = false; });
    var name = activeP === 1 ? p1Name : p2Name;
    document.getElementById('turn-banner').innerText = name + "'s Turn";
    document.getElementById('turn-banner').style.background = activeP === 1 ? '#3b82f6' : '#ec4899';
    
    var isMyTurn = !isOnline || activeP === myPlayerNum;
    document.getElementById('btn-roll').disabled = !isMyTurn;
    setMsg(isMyTurn ? (name + ", roll to start.") : ("Waiting for " + name + "..."));
    draw();
  }

  function draw() {
    var box = document.getElementById('dice-box');
    box.innerHTML = '';
    dice.forEach(function(d, i){
      var el = document.createElement('div');
      var cls = 'die';
      if (d.sel) cls += ' selected';
      if (d.bnk) cls += ' banked';
      if (d.val === '?') cls += ' unrolled';
      el.className = cls;
      el.innerText = d.val;
      el.onclick = function(){ handleToggle(i); };
      box.appendChild(el);
    });

    var selVals = [];
    dice.forEach(function(d){ if(d.sel) selVals.push(d.val); });
    var sc = getScore(selVals);

    var isMyTurn = !isOnline || activeP === myPlayerNum;

    document.getElementById('s1').innerText = scores[1];
    document.getElementById('s2').innerText = scores[2];
    document.getElementById('st').innerText = turnScore + (sc.ok ? sc.pts : 0);
    document.getElementById('btn-roll').disabled = !isMyTurn || isLocked;
    document.getElementById('btn-bank').disabled = !hasRolled || !sc.ok || !selVals.length || isLocked || !isMyTurn;
  }

  function setMsg(txt) { document.getElementById('msg').innerText = txt; }
</script>
</body>
</html>
