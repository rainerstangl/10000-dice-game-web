<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>10,000 Dice Game</title>
  <!-- PeerJS WebRTC Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e293b;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .box {
      background: #0f172a;
      padding: 20px;
      border-radius: 10px;
      width: 350px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: relative;
    }
    h1 { color: #f59e0b; margin-top: 0; }
    input {
      width: 80%;
      padding: 8px;
      margin: 5px 0 15px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background: #f59e0b;
      color: white;
      border: none;
      padding: 10px 15px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .mode-select {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .mode-btn {
      background: #334155;
      padding: 8px 12px;
      font-size: 13px;
    }
    .mode-btn.active { background: #3b82f6; }
    .banner {
      padding: 8px;
      font-weight: bold;
      background: #3b82f6;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    .board {
      display: flex;
      justify-content: space-around;
      background: rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
    }
    .dice-area {
      display: flex;
      justify-content: center;
      gap: 8px;
      min-height: 50px;
      margin-bottom: 15px;
    }
    .die {
      width: 40px;
      height: 40px;
      background: white;
      color: black;
      font-weight: bold;
      font-size: 20px;
      line-height: 40px;
      border-radius: 5px;
      cursor: pointer;
      border: 3px solid transparent;
    }
    .die.selected { border-color: #10b981; transform: translateY(-3px); }
    .die.banked { opacity: 0.3; cursor: default; }
    .die.unrolled { background: #475569; color: #94a3b8; }
    .msg { color: #f59e0b; font-weight: bold; min-height: 20px; margin-top: 10px; }
    .link-box {
      display: none;
      background: rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
    }

    /* DRAMATIC WINNING OVERLAY STYLES */
    #win-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      animation: win-bg-pulse 1.5s infinite alternate;
    }

    @keyframes win-bg-pulse {
      0% { background-color: rgba(15, 23, 42, 0.95); }
      100% { background-color: rgba(30, 27, 75, 0.98); }
    }

    .win-content {
      text-align: center;
      z-index: 1001;
      animation: win-zoom 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes win-zoom {
      0% { transform: scale(0) rotate(-10deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .win-trophy {
      font-size: 90px;
      animation: trophy-bounce 1s infinite alternate ease-in-out;
      margin-bottom: 10px;
    }

    @keyframes trophy-bounce {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-15px) scale(1.1); }
    }

    .win-title {
      font-size: 46px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 20px #f59e0b, 0 0 40px #ef4444;
      margin: 0;
      letter-spacing: 2px;
    }

    .win-subtitle {
      font-size: 22px;
      color: #38bdf8;
      margin-top: 10px;
      font-weight: bold;
      text-shadow: 0 0 10px #0284c7;
    }

    /* CONFETTI & PARTICLES */
    .confetti {
      position: absolute;
      width: 10px; height: 16px;
      top: -20px;
      z-index: 1000;
      opacity: 0.9;
      animation: confetti-fall 3s linear infinite;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }

    .floating-heart {
      position: absolute;
      font-size: 30px;
      z-index: 1000;
      pointer-events: none;
      animation: heart-float 2s ease-out forwards;
    }

    @keyframes heart-float {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- DRAMATIC WINNING OVERLAY -->
<div id="win-overlay">
  <div class="win-content">
    <div class="win-trophy">🏆</div>
    <h1 id="win-winner-text" class="win-title">PLAYER WINS!</h1>
    <div class="win-subtitle">EXACT 10,000 POINTS VICTORY!</div>
    <br><br>
    <button onclick="location.reload()" style="font-size: 16px; padding: 12px 24px;">🔄 Play Again</button>
  </div>
</div>

<div class="box" id="game-box">
  <h1>10,000 Dice</h1>

  <!-- SETUP SCREEN -->
  <div id="setup">
    <div id="mode-select-box" class="mode-select">
      <button class="mode-btn active" id="btn-local" onclick="setMode('local')">Local Play</button>
      <button class="mode-btn" id="btn-online" onclick="setMode('online')">Online Link</button>
    </div>

    <p id="p1-label">Your Name:</p>
    <input type="text" id="p1" value="Player 1">
    
    <div id="p2-input-group">
      <p>Player 2 Name:</p>
      <input type="text" id="p2" value="Player 2">
    </div>

    <button id="btn-start" onclick="startSetup()">Start Game</button>

    <div id="link-box" class="link-box">
      <p style="font-size: 12px; margin: 0 0 5px 0;">Share this link with Player 2:</p>
      <button onclick="copyGameLink()">📋 Copy Invite Link</button>
      <p id="link-status" style="font-size: 11px; color: #f59e0b; margin: 5px 0 0 0;">Connecting...</p>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game" style="display:none;">
    <div id="turn-banner" class="banner">Player 1's Turn</div>

    <div class="board">
      <div><small id="l1">P1</small><br><b id="s1">0</b></div>
      <div><small>Turn</small><br><b id="st">0</b></div>
      <div><small id="l2">P2</small><br><b id="s2">0</b></div>
    </div>

    <div class="dice-area" id="dice-box"></div>

    <div>
      <button id="btn-roll" onclick="handleRoll()">Roll</button>
      <button id="btn-bank" onclick="handleBank()">Bank</button>
    </div>

    <div id="msg" class="msg"></div>
  </div>
</div>

<script>
  var p1Name = "Player 1", p2Name = "Player 2";
  var activeP = 1, myPlayerNum = 1;
  var scores = {1: 0, 2: 0};
  var turnScore = 0;
  var hasRolled = false, isLocked = false, isOnline = false, isWon = false;
  var gameMode = "local";
  var targetRoomId = null;
  var peer = null, conn = null;

  var dice = [
    {val: '?', sel: false, bnk: false},
    {val: '?', sel: false, bnk: false},
    {val: '?', sel: false, bnk: false},
    {val: '?', sel: false, bnk: false},
    {val: '?', sel: false, bnk: false},
    {val: '?', sel: false, bnk: false}
  ];

  window.onload = function() {
    try {
      var urlParams = new URLSearchParams(window.location.search);
      var roomId = urlParams.get('game');
      if (roomId) {
        targetRoomId = roomId;
        gameMode = "join";
        myPlayerNum = 2;
        document.getElementById('mode-select-box').style.display = 'none';
        document.getElementById('p2-input-group').style.display = 'none';
        document.getElementById('p1-label').innerText = "Enter Your Name to Join:";
        document.getElementById('p1').value = "Player 2";
        document.getElementById('btn-start').innerText = "Join Game";
      }
    } catch(e) { console.log(e); }
  };

  function setMode(m) {
    gameMode = m;
    document.getElementById('btn-local').className = 'mode-btn' + (m === 'local' ? ' active' : '');
    document.getElementById('btn-online').className = 'mode-btn' + (m === 'online' ? ' active' : '');
    document.getElementById('p2-input-group').style.display = (m === 'local' ? 'block' : 'none');
  }

  function startSetup() {
    var myEnteredName = document.getElementById('p1').value.trim();

    if (gameMode === 'local') {
      p1Name = myEnteredName || "Player 1";
      p2Name = document.getElementById('p2').value.trim() || "Player 2";
      launchGame();
    } else if (gameMode === 'join') {
      isOnline = true;
      p2Name = myEnteredName || "Player 2";
      document.getElementById('btn-start').disabled = true;
      document.getElementById('btn-start').innerText = "Connecting...";
      joinOnlineGame(targetRoomId);
    } else {
      isOnline = true;
      p1Name = myEnteredName || "Player 1";
      document.getElementById('btn-start').disabled = true;
      document.getElementById('link-box').style.display = 'block';
      hostOnlineGame();
    }
  }

  function hostOnlineGame() {
    if (typeof Peer === 'undefined') {
      alert("PeerJS failed to load. Defaulting to local play.");
      launchGame();
      return;
    }
    peer = new Peer();
    peer.on('open', function(id) {
      window.currentInviteUrl = window.location.origin + window.location.pathname + '?game=' + id;
      document.getElementById('link-status').innerText = "Waiting for Player 2...";
    });
    peer.on('error', function(err) {
      alert("Online connection error. Switching to local play.");
      launchGame();
    });
    peer.on('connection', function(c) {
      conn = c;
      myPlayerNum = 1;
      setupNetworking();
    });
  }

  function joinOnlineGame(roomId) {
    if (typeof Peer === 'undefined') {
      alert("PeerJS failed to load.");
      return;
    }
    myPlayerNum = 2;
    peer = new Peer();
    peer.on('open', function() {
      conn = peer.connect(roomId);
      setupNetworking();
    });
    peer.on('error', function(err) {
      alert("Unable to join game room.");
    });
  }

  function copyGameLink() {
    if (window.currentInviteUrl) {
      navigator.clipboard.writeText(window.currentInviteUrl);
      document.getElementById('link-status').innerText = "Link copied!";
    }
  }

  function setupNetworking() {
    conn.on('open', function() {
      if (myPlayerNum === 2) {
        conn.send({ type: 'GUEST_JOINED', guestName: p2Name });
      }
    });

    conn.on('data', function(data) {
      if (data.type === 'GUEST_JOINED' && myPlayerNum === 1) {
        p2Name = data.guestName;
        conn.send({ type: 'INIT_GAME', p1Name: p1Name, p2Name: p2Name });
        launchGame();
      } else if (data.type === 'INIT_GAME' && myPlayerNum === 2) {
        p1Name = data.p1Name;
        p2Name = data.p2Name;
        launchGame();
      } else if (data.type === 'STATE_SYNC') {
        syncGameState(data.state);
      } else if (data.type === 'GAME_WON') {
        scores = data.scores;
        activeP = data.winnerP;
        isWon = true;
        triggerWinDisplay();
      }
    });
  }

  function sendState() {
    if (isOnline && conn) {
      conn.send({
        type: 'STATE_SYNC',
        state: { dice: dice, turnScore: turnScore, scores: scores, activeP: activeP, hasRolled: hasRolled, isLocked: isLocked, isWon: isWon }
      });
    }
  }

  function sendWinEvent() {
    if (isOnline && conn) {
      conn.send({
        type: 'GAME_WON',
        scores: scores,
        winnerP: activeP
      });
    }
  }

  function syncGameState(state) {
    dice = state.dice;
    turnScore = state.turnScore;
    scores = state.scores;
    activeP = state.activeP;
    hasRolled = state.hasRolled;
    isLocked = state.isLocked;
    isWon = state.isWon;

    if (isWon) {
      triggerWinDisplay();
    } else {
      updateTurnBanner();
      draw();
    }
  }

  function updateTurnBanner() {
    var name = activeP === 1 ? p1Name : p2Name;
    var banner = document.getElementById('turn-banner');
    banner.innerText = name + "'s Turn";
    banner.style.background = activeP === 1 ? '#3b82f6' : '#ec4899';

    var isMyTurn = !isOnline || activeP === myPlayerNum;
    if (!hasRolled) {
      setMsg(isMyTurn ? (name + ", roll to start.") : ("Waiting for " + name + "..."));
    }
  }

  function launchGame() {
    document.getElementById('l1').innerText = p1Name;
    document.getElementById('l2').innerText = p2Name;
    document.getElementById('setup').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    resetTurn();
  }

  function handleRoll() {
    if (isWon || (isOnline && activeP !== myPlayerNum)) return;
    roll();
    sendState();
  }

  function handleBank() {
    if (isWon || (isOnline && activeP !== myPlayerNum)) return;
    bank();
    sendState();
  }

  function handleToggle(i) {
    if (isWon || (isOnline && activeP !== myPlayerNum)) return;
    toggle(i);
    sendState();
  }

  function getScore(vals) {
    if (!vals.length) return {pts: 0, ok: true};
    var pts = 0, used = 0, c = {};
    vals.forEach(function(v){ c[v] = (c[v]||0)+1; });

    if (Object.keys(c).length === 6) return {pts: 1500, ok: true};
    var pairs = 0;
    for (var k in c) { if (c[k] === 2) pairs++; }
    if (pairs === 3) return {pts: 1500, ok: true};

    for (var k in c) {
      var n = Number(k), cnt = c[k];
      if (cnt >= 3) {
        pts += (n === 1 ? 1000 : n * 100) * Math.pow(2, cnt - 3);
        used += cnt;
        delete c[k];
      }
    }
    if (c[1]) { pts += c[1] * 100; used += c[1]; }
    if (c[5]) { pts += c[5] * 50; used += c[5]; }

    return {pts: pts, ok: used === vals.length};
  }

  function roll() {
    if (isLocked || isWon) return;

    if (hasRolled) {
      var selVals = [];
      dice.forEach(function(d){ if(d.sel) selVals.push(d.val); });
      var sc = getScore(selVals);
      if (!sc.ok || !selVals.length) {
        setMsg("Select valid scoring dice first!");
        return;
      }
      turnScore += sc.pts;
      dice.forEach(function(d){ if(d.sel) { d.bnk = true; d.sel = false; } });
      
      if (dice.every(function(d){ return d.bnk; })) {
        dice.forEach(function(d){ d.bnk = false; });
        setMsg("Hot Dice! Roll all 6 again!");
      }
    }

    hasRolled = true;

    dice.forEach(function(d){
      if (!d.bnk) d.val = Math.floor(Math.random() * 6) + 1;
    });

    var activeVals = [];
    dice.forEach(function(d){ if(!d.bnk) activeVals.push(d.val); });
    
    var c = {};
    activeVals.forEach(function(v){ c[v] = (c[v]||0)+1; });
    var canScore = c[1] || c[5] || Object.keys(c).some(function(k){ return c[k]>=3; }) || activeVals.length === 6;

    if (!canScore) {
      turnScore = 0;
      isLocked = true;
      draw();
      setMsg("BUST! No scoring dice.");
      
      setTimeout(function() {
        isLocked = false;
        activeP = activeP === 1 ? 2 : 1;
        resetTurn();
        sendState();
      }, 1800);
      return;
    }

    draw();
    setMsg("Select dice to bank or roll again.");
  }

  function toggle(i) {
    if (!hasRolled || dice[i].bnk || isLocked || isWon) return;
    dice[i].sel = !dice[i].sel;
    draw();
  }

  function bank() {
    if (isLocked || isWon) return;

    // Calculate score from selected dice (if any)
    var selVals = [];
    dice.forEach(function(d){ if(d.sel) selVals.push(d.val); });
    var sc = getScore(selVals);

    // If dice are selected, ensure selection is valid before adding
    var addedPts = 0;
    if (selVals.length > 0) {
      if (!sc.ok) {
        setMsg("Select valid scoring dice to bank!");
        return;
      }
      addedPts = sc.pts;
    }

    var potentialTotal = scores[activeP] + turnScore + addedPts;

    if (potentialTotal > 10000) {
      turnScore = 0;
      isLocked = true;
      draw();
      setMsg("OVER 10,000! Turn lost.");
      
      setTimeout(function() {
        isLocked = false;
        activeP = activeP === 1 ? 2 : 1;
        resetTurn();
        sendState();
      }, 1800);
      return;
    }

    scores[activeP] = potentialTotal;
    if (scores[activeP] === 10000) {
      isWon = true;
      sendWinEvent();
      sendState();
      triggerWinDisplay();
      return;
    }

    activeP = activeP === 1 ? 2 : 1;
    resetTurn();
  }

  function triggerWinDisplay() {
    draw();
    var winnerName = activeP === 1 ? p1Name : p2Name;
    
    document.getElementById('win-winner-text').innerText = winnerName.toUpperCase() + " WINS!";
    var overlay = document.getElementById('win-overlay');
    overlay.style.display = 'flex';

    createConfetti();
    createHearts();
  }

  function createConfetti() {
    var colors = ['#f59e0b', '#ef4444', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
    var overlay = document.getElementById('win-overlay');

    for (var i = 0; i < 70; i++) {
      var confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.animationDelay = (Math.random() * 2) + 's';
      confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
      overlay.appendChild(confetti);
    }
  }

  function createHearts() {
    var overlay = document.getElementById('win-overlay');

    for (var i = 0; i < 35; i++) {
      var heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.innerText = '❤️';
      heart.style.left = '50vw';
      heart.style.top = '50vh';

      var angle = Math.random() * Math.PI * 2;
      var dist = 180 + Math.random() * 320;
      var tx = Math.cos(angle) * dist + 'px';
      var ty = Math.sin(angle) * dist + 'px';

      heart.style.setProperty('--tx', tx);
      heart.style.setProperty('--ty', ty);
      heart.style.animationDelay = (0.2 + Math.random() * 0.5) + 's';

      overlay.appendChild(heart);
    }
  }

  function resetTurn() {
    hasRolled = false;
    turnScore = 0;
    dice.forEach(function(d){ d.val = '?'; d.sel = false; d.bnk = false; });
    updateTurnBanner();
    draw();
  }

  function draw() {
    var box = document.getElementById('dice-box');
    box.innerHTML = '';
    dice.forEach(function(d, i){
      var el = document.createElement('div');
      var cls = 'die';
      if (d.sel) cls += ' selected';
      if (d.bnk) cls += ' banked';
      if (d.val === '?') cls += ' unrolled';
      el.className = cls;
      el.innerText = d.val;
      el.onclick = function(){ handleToggle(i); };
      box.appendChild(el);
    });

    var selVals = [];
    dice.forEach(function(d){ if(d.sel) selVals.push(d.val); });
    var sc = getScore(selVals);
    var isMyTurn = !isOnline || activeP === myPlayerNum;

    document.getElementById('s1').innerText = scores[1];
    document.getElementById('s2').innerText = scores[2];
    document.getElementById('st').innerText = turnScore + (sc.ok ? sc.pts : 0);
    document.getElementById('btn-roll').disabled = !isMyTurn || isLocked || isWon;
    document.getElementById('btn-bank').disabled = !isMyTurn || isLocked || isWon;
  }

  function setMsg(txt) { document.getElementById('msg').innerText = txt; }
</script>
</body>
</html>
